version: '3.8'
services:
  practice_api:
    build:
      context: ./app
      dockerfile: Dockerfile
    hostname: practice_api
    container_name: practice_api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=practice_redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - ROOT_PATH=http://localhost:8001
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
    command: [ "uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    restart: unless-stopped
    depends_on:
      - practice_redis
    networks:
      - practice_network

  practice_redis:
    container_name: practice_redis
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - practice_redis_data:/data
    restart: unless-stopped
    networks:
      - practice_network

volumes:
  practice_redis_data:
    driver: local

networks:
  practice_network:
    driver: bridge
